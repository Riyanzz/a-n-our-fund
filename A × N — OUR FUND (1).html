<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A × N — OUR FUND</title>
<style>
:root{
  --bg:#0E1113;--bg2:#14181B;--surf:#1A1F23;--surf2:#20262A;--bd:#2A3136;--bd2:#333B41;
  --tx:#ECEFF1;--tx2:#9CA6AD;--tx3:#6C767D;
  --gold:#C9A24C;--gold2:#E2C27A;--teal:#3E8677;--teal2:#5FAE9B;
  --danger:#D9695A;--danger-bg:#2A1917;--amber:#D9A441;--green:#5BAE8C;
  --r1:16px;--r2:11px;--r3:999px;
  --shadow:0 10px 28px rgba(0,0,0,.4);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.1px}
button,input,select{font-family:inherit;color:inherit}
input,select{background:var(--surf2);border:1px solid var(--bd2);color:var(--tx);border-radius:var(--r2);padding:11px 13px;font-size:15px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--gold)}
button{cursor:pointer}
.btn{border:none;border-radius:var(--r2);padding:12px 18px;font-size:14.5px;font-weight:600;background:var(--surf2);color:var(--tx);border:1px solid var(--bd2);transition:opacity .15s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1300;border:none}
.btn-teal{background:var(--teal);color:#eafff9;border:none}
.btn-ghost{background:transparent;border:1px solid var(--bd2)}
.btn-danger{background:var(--danger);color:#2a0d08;border:none}
.hidden{display:none!important}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(14,17,19,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:1180px;margin:0 auto;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:16.5px;letter-spacing:.3px}
.brand span{font-size:11.5px;color:var(--tx3)}
.topbar-r{display:flex;align-items:center;gap:10px}
.iconbtn{position:relative;background:var(--surf);border:1px solid var(--bd2);width:38px;height:38px;border-radius:var(--r3);display:flex;align-items:center;justify-content:center;font-size:16px}
.badge{position:absolute;top:-4px;right:-4px;background:var(--amber);color:#241a03;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:var(--r3);display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.userchip{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--bd2);border-radius:var(--r3);padding:5px 12px 5px 5px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--teal2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#111}
.userchip .un{font-size:13.5px;font-weight:600}
.userchip .ur{font-size:10.5px;color:var(--tx3);display:block}
.langtoggle{display:flex;border:1px solid var(--bd2);border-radius:var(--r3);overflow:hidden}
.langtoggle button{background:transparent;border:none;padding:6px 10px;font-size:12px;color:var(--tx3);font-weight:600}
.langtoggle button.on{background:var(--surf2);color:var(--tx)}
.shell{display:flex;flex:1;max-width:1180px;margin:0 auto;width:100%}
.sidebar{width:212px;flex-shrink:0;padding:20px 12px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:var(--r2);color:var(--tx2);font-size:14px;font-weight:500;text-decoration:none;background:transparent;border:none;text-align:left;width:100%}
.navitem:hover{background:var(--surf)}
.navitem.active{background:var(--surf2);color:var(--tx);font-weight:600}
.navitem .nb{background:var(--amber);color:#241a03;font-size:10px;font-weight:700;padding:1px 6px;border-radius:var(--r3)}
.main{flex:1;padding:22px;min-width:0}
.h1{font-size:22px;font-weight:700;margin:0 0 4px}
.sub{color:var(--tx3);font-size:13.5px;margin:0 0 20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r1);padding:18px}
.hero{background:linear-gradient(160deg,var(--surf2),var(--surf));border:1px solid var(--bd2);border-radius:var(--r1);padding:24px;margin-bottom:14px}
.hero .lbl{font-size:12.5px;color:var(--tx3);margin-bottom:6px}
.hero .val{font-size:34px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.splitbar{height:8px;border-radius:var(--r3);background:var(--bd2);overflow:hidden;display:flex;margin:14px 0 8px}
.splitrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.stat .lbl{font-size:12px;color:var(--tx3);margin-bottom:6px}
.stat .val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.actionrow{display:flex;gap:10px;margin-top:16px}
.actionrow .btn{flex:1}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}
.list-item:last-child{border-bottom:none}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--r3)}
.pill-pending{background:#3a2e12;color:var(--amber)}
.pill-approved{background:#12301f;color:var(--green)}
.pill-rejected{background:var(--danger-bg);color:var(--danger)}
.pill-cancelled{background:#26292c;color:var(--tx3)}
.empty{color:var(--tx3);font-size:13.5px;padding:22px 0;text-align:center}
.banner{background:var(--danger-bg);border:1px solid #4a2620;color:#f3c9c0;border-radius:var(--r2);padding:13px 16px;margin:16px 22px 0;display:flex;align-items:center;gap:10px;font-size:13.5px;max-width:1136px;margin-left:auto;margin-right:auto}
.banner b{color:var(--danger)}
.goalbar{height:7px;background:var(--bd2);border-radius:var(--r3);overflow:hidden;margin:8px 0}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2))}
.modal-ov{position:fixed;inset:0;background:rgba(6,7,8,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--r1);width:420px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--bd)}
.modal-h b{font-size:15.5px}
.modal-b{padding:18px}
.steps{display:flex;gap:5px;margin-bottom:16px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--bd2)}
.steps i.on{background:var(--gold)}
.field{margin-bottom:14px}
.field label{font-size:12.5px;color:var(--tx2);display:block;margin-bottom:6px}
.err{color:var(--danger);font-size:12px;margin-top:5px}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13.5px}
.summary-row:last-child{border:none}
.modal-f{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--bd)}
.modal-f .btn{flex:1}
.upload{border:1.5px dashed var(--bd2);border-radius:var(--r2);padding:20px;text-align:center;font-size:13px;color:var(--tx3)}
.upload.ok{border-color:var(--green);color:var(--green)}
.upload.bad{border-color:var(--danger);color:var(--danger)}
.notifpanel,.lyrapanel{position:fixed;top:0;right:0;height:100%;width:360px;max-width:92vw;background:var(--bg2);border-left:1px solid var(--bd2);z-index:60;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--bd)}
.panel-b{flex:1;overflow:auto;padding:14px 18px}
.notif-item{padding:11px 0;border-bottom:1px solid var(--bd);font-size:13px}
.notif-item small{color:var(--tx3);display:block;margin-top:3px}
.notif-item.unread{position:relative;padding-left:12px}
.notif-item.unread:before{content:'';position:absolute;left:0;top:16px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.lyra-fab{position:fixed;bottom:22px;right:22px;z-index:40;background:var(--surf);border:1px solid var(--gold);color:var(--gold2);border-radius:var(--r3);padding:12px 18px;font-weight:700;font-size:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:7px}
.lyra-msgs{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.lyra-msg{max-width:85%;padding:10px 13px;border-radius:13px;font-size:13.5px;line-height:1.45}
.lyra-msg.u{align-self:flex-end;background:var(--gold);color:#1a1300}
.lyra-msg.a{align-self:flex-start;background:var(--surf2);border:1px solid var(--bd2)}
.lyra-inputrow{display:flex;gap:8px;padding:12px;border-top:1px solid var(--bd)}
.lyra-chip{background:var(--surf2);border:1px solid var(--bd2);border-radius:var(--r3);padding:6px 11px;font-size:12px;color:var(--tx2);margin:3px 4px 0 0;display:inline-block}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:380px;max-width:100%;background:var(--surf);border:1px solid var(--bd2);border-radius:var(--r1);padding:30px 26px;box-shadow:var(--shadow)}
.login-brand{text-align:center;margin-bottom:22px}
.login-brand b{font-size:21px;display:block}
.login-brand span{font-size:12.5px;color:var(--tx3)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surf2);border:1px solid var(--bd2);border-radius:var(--r2);padding:11px 18px;font-size:13.5px;z-index:90;box-shadow:var(--shadow)}
.toast.err{border-color:var(--danger);color:#ffd9d2}
.toast.ok{border-color:var(--green);color:#d3f3e6}
.svgchart{width:100%;height:auto}
.mobilenav{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--bd)}
th{color:var(--tx3);font-weight:600;font-size:11.5px}
.tablewrap{overflow-x:auto}
.milestone{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd)}
.milestone:last-child{border:none}
.mdot{width:9px;height:9px;border-radius:50%;background:var(--gold);margin-top:5px;flex-shrink:0}
@media(max-width:900px){
  .shell{flex-direction:column}
  .sidebar{display:none}
  .mobilenav{display:flex;position:sticky;bottom:0;background:rgba(20,24,27,.95);backdrop-filter:blur(8px);border-top:1px solid var(--bd);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:15;justify-content:space-around}
  .mobilenav .navitem{flex-direction:column;font-size:10.5px;text-align:center;padding:6px 4px;gap:2px}
  .grid3{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .brand span{display:none}
  .userchip .ur{display:none}
}
@media(max-width:520px){
  .grid3{grid-template-columns:1fr}
  .hero .val{font-size:27px}
  .wrap,.main{padding-left:14px;padding-right:14px}
  .notifpanel,.lyrapanel{width:100%;max-width:100%}
}
</style>
</head>

/* ---------- DATA LAYER (client-persisted ledger; see chat note on shared-sync upgrade path) ---------- */
const DB_KEY='afn_db_v1';

  inv:[],

function loadDB(){let d=localStorage.getItem(DB_KEY);if(!d){const s=seedDB();localStorage.setItem(DB_KEY,JSON.stringify(s));return s;}return JSON.parse(d);}
function saveDB(d){localStorage.setItem(DB_KEY,JSON.stringify(d));}
async function sha256(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function fmt(n){return 'Rp'+Math.round(n||0).toLocaleString('id-ID');}
function fmtDate(ts){return new Date(ts).toLocaleDateString(getLang()==='id'?'id-ID':'en-US',{day:'numeric',month:'short',year:'numeric'});}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}

function approvedTx(db,type){return db.tx.filter(x=>x.type===type&&x.status==='approved');}
function pendingTx(db,type){return db.tx.filter(x=>(!type||x.type===type)&&x.status==='pending');}
function totalContrib(db,who){return approvedTx(db,'deposit').filter(x=>x.by===who).reduce((s,x)=>s+x.amount,0);}
function cashBalance(db){return approvedTx(db,'deposit').reduce((s,x)=>s+x.amount,0)-approvedTx(db,'withdrawal').reduce((s,x)=>s+x.amount,0);}
function investValue(db){return db.inv.reduce((s,i)=>s+i.currentValue,0);}
function totalFund(db){return cashBalance(db)+investValue(db);}
function pendingWithdrawSum(db){return pendingTx(db,'withdrawal').reduce((s,x)=>s+x.amount,0);}
function availBalance(db){return Math.max(0,cashBalance(db)-pendingWithdrawSum(db));}
function goalCurrent(db,gid){return approvedTx(db,'deposit').filter(x=>x.target===gid).reduce((s,x)=>s+x.amount,0);}
function splitPct(db){const a=totalContrib(db,'arkan'),n=totalContrib(db,'nazla'),tot=a+n;if(tot<=0)return{a:50,n:50};return{a:Math.round(a/tot*100),n:Math.round(n/tot*100)};}
function pushNotif(db,key,audience){db.notif.unshift({id:uid(),key,audience,read:false,ts:Date.now()});}

/* ---------- SESSION ---------- */
function getSession(){try{const s=JSON.parse(localStorage.getItem('afn_sess'));if(s&&s.exp>Date.now())return s;}catch(e){}return null;}
function setSession(s){localStorage.setItem('afn_sess',JSON.stringify(s));}
function clearSession(){localStorage.removeItem('afn_sess');}

let STATE={route:'dashboard',modal:null,modalStep:1,wizard:{},notifOpen:false,lyraOpen:false,lyraMsgs:[],toast:null,loginErr:'',loginBusy:false};
function toast(msg,type){STATE.toast={msg,type};render();setTimeout(()=>{STATE.toast=null;render();},2600);}

const ROUTES=['dashboard','investments','analytics','journey','settings','admin'];
window.addEventListener('hashchange',()=>{syncRouteFromHash();render();});
function syncRouteFromHash(){const h=(location.hash||'#/dashboard').replace('#/','');STATE.route=ROUTES.includes(h)?h:'dashboard';}
function goto(r){location.hash='#/'+r;}

/* ---------- RENDER ---------- */
function render(){
  const app=document.getElementById('app');
  const sess=getSession();
  if(!sess){app.innerHTML=renderLogin();bind();return;}
  const db=loadDB();
  if(STATE.route==='admin'&&sess.role!=='admin'){
    STATE.route='dashboard';location.hash='#/dashboard';
    STATE.toast={msg:t('unauthorized'),type:'err'};
    setTimeout(()=>{STATE.toast=null;render();},2600);
  }
  let content='';
  if(STATE.route==='dashboard')content=renderDashboard(db,sess);
  else if(STATE.route==='investments')content=renderInvestments(db,sess);
  else if(STATE.route==='analytics')content=renderAnalytics(db,sess);
  else if(STATE.route==='journey')content=renderJourney(db,sess);
  else if(STATE.route==='settings')content=renderSettings(db,sess);
  else if(STATE.route==='admin')content=sess.role==='admin'?renderAdmin(db,sess):'';
  app.innerHTML=renderShell(content,db,sess);
  renderOverlays(db,sess);
  bind();
}

function targetLabel(g){if(g==='general')return t('general_fund');if(g==='dest_arkan')return t('dest_arkan');if(g==='dest_nazla')return t('dest_nazla');const db=loadDB();const goal=db.goals.find(x=>x.id===g);if(goal)return getLang()==='id'?goal.id_:goal.en;return g;}
function goalRow(db,g){const cur=goalCurrent(db,g.id);const pct=Math.min(100,Math.round(cur/g.target*100));const name=getLang()==='id'?g.id_:g.en;
  return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${name}</span><span style="color:var(--tx3)">${fmt(cur)} / ${fmt(g.target)}</span></div><div class="goalbar"><i style="width:${pct}%"></i></div></div>`;}

  else if(s===3){body=`<p class="sub" style="margin-top:0">${t('tu_bank')}</p><div class="card" style="background:var(--surf2)"><div class="summary-row"><span>Bank</span><span>BCA</span></div><div class="summary-row"><span>No. Rek</span><span>1234567890</span></div><div class="summary-row"><span>${t('contributor')}</span><span>A × N OUR FUND</span></div></div>`;}
  else if(s===4){body=`<div class="upload ${w.proof?'ok':''}" id="uploadBox">${w.proof?('✓ '+t('tu_uploaded')+': '+w.proof):t('tu_upload_cta')}</div><input type="file" id="wFile" accept="image/*,application/pdf" class="hidden">${w.err?`<div class="err">${w.err}</div>`:''}`;}
  else{body=`<div class="summary-row"><span>${t('amount')}</span><span>${fmt(w.amount)}</span></div><div class="summary-row"><span>${t('contributor')}</span><span>${sess.name}</span></div><div class="summary-row"><span>${t('target')}</span><span>${targetLabel(w.target)}</span></div><div class="summary-row"><span>${t('method')}</span><span>${t('method_transfer')}</span></div><div class="summary-row"><span>${t('proof_status')}</span><span>${w.proof||'-'}</span></div>`;}
  return `<div class="modal-ov"><div class="modal">
  <div class="modal-h"><b>${t('topup')}</b><button class="iconbtn" data-act="modal-close">✕</button></div>
  <div class="modal-b"><div class="steps">${[1,2,3,4,5].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>
  <div class="sub" style="margin-top:0">${t('step')} ${s}/5 · ${['','tu_amount','tu_target','tu_pay','tu_proof','tu_confirm'][s]?t(['','tu_amount','tu_target','tu_pay','tu_proof','tu_confirm'][s]):''}</div>
  ${body}</div>
  <div class="modal-f">${s>1?`<button class="btn btn-ghost" data-act="tu-back">${t('back')}</button>`:`<button class="btn btn-ghost" data-act="modal-close">${t('cancel')}</button>`}
  ${s<5?`<button class="btn btn-gold" data-act="tu-next">${t('next')}</button>`:`<button class="btn btn-gold" data-act="tu-submit">${t('submit')}</button>`}</div>
  </div></div>`;
}
function withdrawModal(db,sess){
  const s=STATE.modalStep,w=STATE.wizard;
  const ab=availBalance(db);
  let body='';
  if(s===1){body=`<div class="field"><label>${t('w_amount_lbl')}</label><input id="wAmount" type="number" min="0" value="${w.amount||''}" placeholder="100000"><div class="sub" style="margin:6px 0 0">${t('avail_note')}: ${fmt(ab)}</div>${w.err?`<div class="err">${w.err}</div>`:''}</div>`;}
  else if(s===2){body=`<div class="field"><label>${t('w_dest_lbl')}</label><select id="wDest"><option value="dest_arkan" ${w.dest==='dest_arkan'?'selected':''}>${t('dest_arkan')}</option><option value="dest_nazla" ${w.dest==='dest_nazla'?'selected':''}>${t('dest_nazla')}</option></select></div>`;}
  else{body=`<div class="summary-row"><span>${t('amount')}</span><span>${fmt(w.amount)}</span></div><div class="summary-row"><span>${t('destination')}</span><span>${targetLabel(w.dest)}</span></div><div class="summary-row"><span>${t('contributor')}</span><span>${sess.name}</span></div><div class="summary-row"><span>${t('proof_status')}</span><span>${t('status_pending')}</span></div>`;}
  return `<div class="modal-ov"><div class="modal">
  <div class="modal-h"><b>${t('withdraw')}</b><button class="iconbtn" data-act="modal-close">✕</button></div>
  <div class="modal-b"><div class="steps">${[1,2,3].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>
  <div class="sub" style="margin-top:0">${t('step')} ${s}/3</div>${body}</div>
  <div class="modal-f">${s>1?`<button class="btn btn-ghost" data-act="wd-back">${t('back')}</button>`:`<button class="btn btn-ghost" data-act="modal-close">${t('cancel')}</button>`}
  ${s<3?`<button class="btn btn-teal" data-act="wd-next">${t('next')}</button>`:`<button class="btn btn-teal" data-act="wd-submit">${t('submit')}</button>`}</div>
  </div></div>`;
}
function notifPanel(db,sess){
  const list=db.notif.filter(n=>n.audience==='all'||sess.role==='admin').slice(0,25);
  const KMAP={dep_sub:'n_dep_sub',dep_appr:'n_dep_appr',dep_rej:'n_dep_rej',wd_sub:'n_wd_sub',wd_appr:'n_wd_appr',wd_rej:'n_wd_rej',freeze_on:'n_freeze_on',freeze_off:'n_freeze_off'};
  return `<div class="notifpanel"><div class="panel-h"><b>${t('notif_title')}</b><button class="iconbtn" data-act="notif-toggle">✕</button></div>
  <div class="panel-b">${list.length?list.map(n=>`<div class="notif-item ${n.read?'':'unread'}">${t(KMAP[n.key]||n.key)}<small>${fmtDate(n.ts)}</small></div>`).join(''):`<div class="empty">${t('no_notif')}</div>`}</div>
  ${list.length?`<div style="padding:12px 18px;border-top:1px solid var(--bd)"><button class="btn btn-ghost" style="width:100%" data-act="notif-read">${t('mark_read')}</button></div>`:''}
  </div>`;
}
function lyraPanel(db,sess){
  return `<div class="lyrapanel"><div class="panel-h"><div><b>${t('lyra_title')}</b><div class="sub" style="margin:2px 0 0">${t('lyra_sub')}</div></div><button class="iconbtn" data-act="lyra-toggle">✕</button></div>
  <div class="lyra-msgs" id="lyraMsgs">
    <div class="lyra-msg a">${t('lyra_greet')}</div>
    ${STATE.lyraMsgs.map(m=>`<div class="lyra-msg ${m.who}">${m.text}</div>`).join('')}
  </div>
  <div class="lyra-inputrow"><input id="lyraInput" placeholder="${t('lyra_ph')}"><button class="btn btn-gold" data-act="lyra-send">${t('submit')}</button></div>
  </div>`;
}

/* ---------- LYRA (rule-based, reads only real stored ledger data; role-aware) ---------- */
function askLyra(q,db,sess){
  const s=q.toLowerCase();
  const sp=splitPct(db);
  if(/split|persentase|kontribusi|contribution/.test(s))return `Arkan ${sp.a}% (${fmt(totalContrib(db,'arkan'))}) · Nazla ${sp.n}% (${fmt(totalContrib(db,'nazla'))}).`;
  if(/pending|tertunda/.test(s)){const p=pendingTx(db);if(!p.length)return getLang()==='id'?'Tidak ada transaksi tertunda saat ini.':'No transactions are pending right now.';return (getLang()==='id'?'Tertunda: ':'Pending: ')+p.map(x=>`${x.type} ${fmt(x.amount)}`).join(', ');}
  if(/total|fund value|nilai dana/.test(s))return `${t('total_fund')}: ${fmt(totalFund(db))}.`;
  if(/invest/.test(s))return `${t('invest_value')}: ${fmt(investValue(db))}.`;
  if(/goal|tujuan/.test(s))return db.goals.map(g=>`${getLang()==='id'?g.id_:g.en}: ${fmt(goalCurrent(db,g.id))}/${fmt(g.target)}`).join(' · ');
  if(/month|bulan/.test(s)){const now=new Date();const k=now.getFullYear()+'-'+(now.getMonth()+1);const sum=approvedTx(db,'deposit').filter(x=>{const d=new Date(x.ts);return (d.getFullYear()+'-'+(d.getMonth()+1))===k;}).reduce((a,x)=>a+x.amount,0);return (getLang()==='id'?'Setoran bulan ini: ':'This month\'s deposits: ')+fmt(sum);}
  if(/balance|saldo/.test(s))return `${t('avail_bal')}: ${fmt(availBalance(db))}.`;
  if(/freeze|beku/.test(s))return db.freeze.active?t('freeze_banner'):(getLang()==='id'?'Penarikan tidak sedang dibekukan.':'Withdrawals are not currently frozen.');
  return t('lyra_unknown');
}

/* ---------- EVENT BINDING ---------- */
function bind(){
  document.querySelectorAll('[data-act]').forEach(el=>{
    el.onclick=async(e)=>{
      const act=el.dataset.act;
      if(act==='lang'){setLang(el.dataset.v);return;}
      if(act==='login'){await doLogin();return;}
      if(act==='logout'){clearSession();toast(t('toast_logout'));render();return;}
      if(act==='nav'){STATE.notifOpen=false;STATE.lyraOpen=false;goto(el.dataset.to);return;}
      if(act==='notif-toggle'){STATE.notifOpen=!STATE.notifOpen;render();return;}
      if(act==='notif-read'){const db=loadDB();db.notif.forEach(n=>n.read=true);saveDB(db);render();return;}
      if(act==='lyra-toggle'){STATE.lyraOpen=!STATE.lyraOpen;render();return;}
      if(act==='lyra-send'){sendLyra();return;}
      if(act==='topup-open'){STATE.modal='topup';STATE.modalStep=1;STATE.wizard={target:'general'};renderOverlays(loadDB(),getSession());bind();return;}
      if(act==='withdraw-open'){const db=loadDB();if(db.freeze.active){toast(t('err_frozen'),'err');return;}STATE.modal='withdraw';STATE.modalStep=1;STATE.wizard={dest:'dest_arkan'};renderOverlays(db,getSession());bind();return;}
      if(act==='modal-close'){STATE.modal=null;renderOverlays(loadDB(),getSession());bind();return;}
      if(act==='tu-next'){tuNext();return;}
      if(act==='tu-back'){STATE.modalStep--;renderOverlays(loadDB(),getSession());bind();return;}
      if(act==='tu-submit'){tuSubmit();return;}
      if(act==='wd-next'){wdNext();return;}
      if(act==='wd-back'){STATE.modalStep--;renderOverlays(loadDB(),getSession());bind();return;}
      if(act==='wd-submit'){wdSubmit();return;}
      if(act==='freeze-toggle'){freezeToggle();return;}
      if(act==='admin-approve'){adminDecide(el.dataset.id,'approved');return;}
      if(act==='admin-reject'){adminDecide(el.dataset.id,'rejected');return;}
    };
  });
  const ub=document.getElementById('uploadBox');
  if(ub)ub.onclick=()=>document.getElementById('wFile').click();
  const wf=document.getElementById('wFile');
  if(wf)wf.onchange=()=>{
    const f=wf.files[0];
    if(!f){return;}
    const okType=/^image\//.test(f.type)||f.type==='application/pdf';
    if(!okType||f.size>5*1024*1024){STATE.wizard.err=t('err_file');STATE.wizard.proof=null;}
    else{STATE.wizard.proof=f.name;STATE.wizard.err='';}
    renderOverlays(loadDB(),getSession());bind();
  };
  const li=document.getElementById('loginId');
  if(li)document.getElementById('loginPw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  const lin=document.getElementById('lyraInput');
  if(lin)lin.addEventListener('keydown',e=>{if(e.key==='Enter')sendLyra();});
}
async function doLogin(){
  const idv=(document.getElementById('loginId').value||'').trim().toLowerCase();
  const pw=document.getElementById('loginPw').value||'';
  if(!idv||!pw){STATE.loginErr=t('err_required');render();return;}
  STATE.loginBusy=true;STATE.loginErr='';render();
  const db=loadDB();
  await new Promise(r=>setTimeout(r,450));
  const hash=await sha256(pw);
  let found=null;
  for(const uid_ in db.users){const u=db.users[uid_];if(u.email.toLowerCase()===idv||u.username.toLowerCase()===idv){found=uid_;break;}}
  STATE.loginBusy=false;
  if(found&&db.users[found].hash===hash){
    setSession({uid:found,name:db.users[found].name,role:db.users[found].role,exp:Date.now()+12*3600*1000});
    STATE.loginErr='';goto('dashboard');render();
  }else{STATE.loginErr=t('login_err');render();}
}
function tuNext(){
  const w=STATE.wizard;
  if(STATE.modalStep===1){
    const v=parseFloat(document.getElementById('wAmount').value);
    if(!v&&v!==0){w.err=t('err_required');}else if(isNaN(v)){w.err=t('err_number');}else if(v<=0){w.err=t('err_positive');}else if(v<10000){w.err=t('err_min');}
    else{w.amount=v;w.err='';STATE.modalStep=2;}
  }else if(STATE.modalStep===2){w.target=document.getElementById('wTarget').value;STATE.modalStep=3;}
  else if(STATE.modalStep===3){STATE.modalStep=4;}
  else if(STATE.modalStep===4){if(!w.proof){w.err=t('err_file');}else{STATE.modalStep=5;}}
  renderOverlays(loadDB(),getSession());bind();
}
function tuSubmit(){
  const db=loadDB();const sess=getSession();const w=STATE.wizard;
  db.tx.push({id:uid(),type:'deposit',amount:w.amount,by:sess.uid,target:w.target,status:'pending',ts:Date.now(),method:'transfer',proof:w.proof});
  pushNotif(db,'dep_sub','admin');
  saveDB(db);STATE.modal=null;toast(t('tu_success'),'ok');render();
}
function wdNext(){
  const w=STATE.wizard;const db=loadDB();const ab=availBalance(db);
  if(STATE.modalStep===1){
    const v=parseFloat(document.getElementById('wAmount').value);
    if(!v&&v!==0){w.err=t('err_required');}else if(isNaN(v)){w.err=t('err_number');}else if(v<=0){w.err=t('err_positive');}else if(v<10000){w.err=t('err_min');}else if(v>ab){w.err=t('err_over');}
    else{w.amount=v;w.err='';STATE.modalStep=2;}
  }else if(STATE.modalStep===2){w.dest=document.getElementById('wDest').value;STATE.modalStep=3;}
  renderOverlays(loadDB(),getSession());bind();
}
function wdSubmit(){
  const db=loadDB();const sess=getSession();const w=STATE.wizard;
  if(db.freeze.active){toast(t('err_frozen'),'err');STATE.modal=null;render();return;}
  if(w.amount>availBalance(db)){toast(t('err_over'),'err');STATE.modal=null;render();return;}
  db.tx.push({id:uid(),type:'withdrawal',amount:w.amount,by:sess.uid,dest:w.dest,status:'pending',ts:Date.now()});
  pushNotif(db,'wd_sub','admin');
  saveDB(db);STATE.modal=null;toast(t('w_success'),'ok');render();
}
function freezeToggle(){
  const db=loadDB();db.freeze.active=!db.freeze.active;db.freeze.at=Date.now();
  pushNotif(db,db.freeze.active?'freeze_on':'freeze_off','all');
  saveDB(db);render();
}
function adminDecide(id,status){
  const db=loadDB();const x=db.tx.find(t=>t.id===id);if(!x)return;
  x.status=status;
  const key=(x.type==='deposit'?'dep_':'wd_')+(status==='approved'?'appr':'rej');
  pushNotif(db,key,'all');
  saveDB(db);render();
}
function sendLyra(){
  const inp=document.getElementById('lyraInput');const q=inp.value.trim();if(!q)return;
  const db=loadDB();const sess=getSession();
  STATE.lyraMsgs.push({who:'u',text:q});
  const ans=askLyra(q,db,sess);
  STATE.lyraMsgs.push({who:'a',text:ans});
  renderOverlays(db,sess);bind();
  const box=document.getElementById('lyraMsgs');if(box)box.scrollTop=box.scrollHeight;
  const ni=document.getElementById('lyraInput');if(ni)ni.focus();
}

/* ---------- INIT ---------- */
syncRouteFromHash();
if(!getSession())location.hash='';
render();
</script>
